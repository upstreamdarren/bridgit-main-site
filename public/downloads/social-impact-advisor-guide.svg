<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754" role="img" aria-labelledby="title desc">
  <title id="title">Bridgit Social Impact Advisor guide</title>
  <desc id="desc">A one-page overview of the Social Impact Advisor, delivered with Social Enterprise UK.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#361064"/><stop offset=".52" stop-color="#8227b5"/><stop offset="1" stop-color="#277f9f"/></linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#48a6cd"/><stop offset="1" stop-color="#c223a9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#30133f" flood-opacity=".13"/></filter>
    <style>
      text{font-family:Arial,'Helvetica Neue',sans-serif}.eyebrow{font-size:18px;letter-spacing:3px;font-weight:800}.title{font-size:61px;font-weight:800}.lead{font-size:25px}.section-title{font-size:35px;font-weight:800}.card-title{font-size:24px;font-weight:800}.body{font-size:18px}.small{font-size:15px}.step{font-size:21px;font-weight:800}
    </style>
  </defs>
  <rect width="1240" height="1754" fill="#fcf9fd"/>
  <rect width="1240" height="490" fill="url(#hero)"/>
  <circle cx="1090" cy="80" r="260" fill="#fff" opacity=".06"/><circle cx="115" cy="445" r="210" fill="#e331ae" opacity=".11"/>
  <text x="70" y="64" class="eyebrow" fill="#f4d9f1">FREE GUIDED TOOL • DELIVERED WITH SOCIAL ENTERPRISE UK</text>
  <text x="70" y="150" class="title" fill="#fff">Turn the difference you make</text>
  <text x="70" y="220" class="title" fill="#fff">into evidence people can act on.</text>
  <text x="70" y="286" class="lead" fill="#f0e8f5">Clarify your impact story, choose proportionate evidence</text>
  <text x="70" y="324" class="lead" fill="#f0e8f5">and build a focused 90-day plan for what comes next.</text>
  <g transform="translate(70 365)"><rect width="470" height="70" rx="28" fill="#fff"/><text x="32" y="44" font-size="21" font-weight="800" fill="#5b1f8d">Talk or type • Work at your own pace</text></g>
  <g transform="translate(570 365)"><rect width="515" height="70" rx="28" fill="#fff" opacity=".14" stroke="#fff" stroke-opacity=".4"/><text x="32" y="44" font-size="21" font-weight="800" fill="#fff">Receive your tailored plan by email</text></g>

  <text x="70" y="555" class="eyebrow" fill="#8d2394">WHY USE THE ADVISOR?</text>
  <text x="70" y="610" class="section-title" fill="#26123f">Your impact is real. Showing it can be messy.</text>
  <g transform="translate(70 650)">
    <g filter="url(#shadow)"><rect width="345" height="220" rx="26" fill="#fff" stroke="#e5d8ea"/></g><circle cx="52" cy="52" r="27" fill="#f4deef"/><text x="52" y="59" text-anchor="middle" font-size="18" font-weight="800" fill="#ad218e">01</text>
    <text x="94" y="60" class="card-title" fill="#3b185c">Find your story</text><text x="30" y="112" class="body" fill="#615a70"><tspan x="30">Explain who benefits, what</tspan><tspan x="30" dy="28">changes and why your work</tspan><tspan x="30" dy="28">makes that change possible.</tspan></text>
  </g>
  <g transform="translate(448 650)">
    <g filter="url(#shadow)"><rect width="345" height="220" rx="26" fill="#fff" stroke="#e5d8ea"/></g><circle cx="52" cy="52" r="27" fill="#e3eef7"/><text x="52" y="59" text-anchor="middle" font-size="18" font-weight="800" fill="#347da3">02</text>
    <text x="94" y="60" class="card-title" fill="#3b185c">Choose evidence</text><text x="30" y="112" class="body" fill="#615a70"><tspan x="30">Combine stories, feedback,</tspan><tspan x="30" dy="28">service data and outcomes</tspan><tspan x="30" dy="28">without overloading the team.</tspan></text>
  </g>
  <g transform="translate(826 650)">
    <g filter="url(#shadow)"><rect width="345" height="220" rx="26" fill="#fff" stroke="#e5d8ea"/></g><circle cx="52" cy="52" r="27" fill="#e4f0df"/><text x="52" y="59" text-anchor="middle" font-size="18" font-weight="800" fill="#577946">03</text>
    <text x="94" y="60" class="card-title" fill="#3b185c">Act on learning</text><text x="30" y="112" class="body" fill="#615a70"><tspan x="30">Turn evidence into clearer</tspan><tspan x="30" dy="28">decisions, better delivery and</tspan><tspan x="30" dy="28">a practical improvement plan.</tspan></text>
  </g>

  <rect x="70" y="920" width="1100" height="320" rx="34" fill="#2d1052"/>
  <text x="108" y="976" class="eyebrow" fill="#eccfee">WHAT YOU WILL CREATE</text>
  <g transform="translate(108 1010)"><circle cx="34" cy="34" r="34" fill="#c528a5"/><text x="34" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">1</text><text x="84" y="29" class="step" fill="#fff">A clear impact story</text><text x="84" y="56" class="small" fill="#e7dced">A simple account of who benefits and what changes.</text></g>
  <g transform="translate(620 1010)"><circle cx="34" cy="34" r="34" fill="#8b2fc0"/><text x="34" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">2</text><text x="84" y="29" class="step" fill="#fff">An evidence plan</text><text x="84" y="56" class="small" fill="#e7dced">A manageable set of measures your team can use.</text></g>
  <g transform="translate(108 1110)"><circle cx="34" cy="34" r="34" fill="#408abb"/><text x="34" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">3</text><text x="84" y="29" class="step" fill="#fff">A 90-day action plan</text><text x="84" y="56" class="small" fill="#e7dced">Focused next steps to test, learn and communicate.</text></g>
  <g transform="translate(620 1110)"><circle cx="34" cy="34" r="34" fill="#42a4a9"/><text x="34" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">4</text><text x="84" y="29" class="step" fill="#fff">A copy in your inbox</text><text x="84" y="56" class="small" fill="#e7dced">Ask the advisor to email the tailored plan to you.</text></g>

  <text x="70" y="1315" class="eyebrow" fill="#8d2394">HOW IT WORKS</text>
  <text x="70" y="1364" class="section-title" fill="#26123f">Start with people. Keep the process proportionate.</text>
  <line x1="140" y1="1442" x2="1090" y2="1442" stroke="#d9cbe6" stroke-width="5"/>
  <g transform="translate(85 1406)"><circle cx="55" cy="36" r="36" fill="#c629a5"/><text x="55" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text><text x="0" y="104" class="step" fill="#3b185c">Describe</text><text x="0" y="132" class="small" fill="#645b70">Who should benefit?</text></g>
  <g transform="translate(360 1406)"><circle cx="55" cy="36" r="36" fill="#8a31bd"/><text x="55" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text><text x="0" y="104" class="step" fill="#3b185c">Trace change</text><text x="0" y="132" class="small" fill="#645b70">What should happen?</text></g>
  <g transform="translate(655 1406)"><circle cx="55" cy="36" r="36" fill="#408abb"/><text x="55" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text><text x="0" y="104" class="step" fill="#3b185c">Choose evidence</text><text x="0" y="132" class="small" fill="#645b70">What will help you learn?</text></g>
  <g transform="translate(960 1406)"><circle cx="55" cy="36" r="36" fill="#48a69d"/><text x="55" y="44" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">4</text><text x="0" y="104" class="step" fill="#3b185c">Improve</text><text x="0" y="132" class="small" fill="#645b70">What will you do next?</text></g>

  <rect x="70" y="1590" width="1100" height="104" rx="32" fill="url(#cta)"/>
  <text x="105" y="1634" font-size="17" letter-spacing="2" font-weight="800" fill="#fff">FREE TO USE • TALK OR TYPE</text>
  <text x="105" y="1668" font-size="26" font-weight="800" fill="#fff">Start at bridgit.care/social-impact-advisor</text>
  <text x="1128" y="1656" text-anchor="end" font-size="25" font-weight="800" fill="#fff">bridgit</text>
  <text x="620" y="1730" text-anchor="middle" class="small" fill="#716979">A helpful thinking partner, not an auditor or independent evaluator.</text>
</svg>
